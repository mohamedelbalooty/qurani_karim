name: qurany_karim
description: A new Flutter project.

publish_to: 'none'

version: 1.0.4+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.8.0+1
  dartz: ^0.10.1
  provider: ^6.1.5
  after_layout: ^1.2.0
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pull_to_refresh: ^2.0.0
  localize_and_translate: ^6.0.8
  share_plus: any
  geolocator: any
  flutter_qiblah: 3.2.0
  adhan_dart: ^2.0.1
#  adhan: ^2.0.0+1
  intl: ^0.20.2
  animate_do: ^4.2.0
  assets_audio_player_plus: any
  youtube_player_flutter: ^9.1.1
  package_info_plus: any
  url_launcher: ^6.3.2
  store_redirect: ^2.0.4
  fluttertoast: any
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.4.3
flutter_native_splash:
  color: "#6C3483"
  image: "assets/icons/drawer_logo.png"
  android: true
  ios: true

flutter:

  uses-material-design: true

  assets:
    - assets/langs/ar.json
    - assets/langs/en.json
    - assets/images/
    - assets/icons/
    - assets/json_db/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf

